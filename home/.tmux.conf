## This is obsolete and not used anymore replace by `herdr`

unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set-option -g status-position top

# Prefix
set -g prefix C-s
set -g mouse on
 
set -g mode-keys emacs
set -g status-keys emacs

# Pane navigation (vim-style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Clear screen + scrollback
bind C-l send-keys C-l \; clear-history

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Plugins (tpm bootstraps itself at the bottom, not listed here)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'Morantron/tmux-fingers'

set -g @fingers-patterns '(
    "^\\s*git\\s+(checkout|commit|push|pull|branch|merge|rebase|status|log|tag).*"
    "^\\s*([a-zA-Z0-9_-]+)(\\s+.+)?$"
    "^(\\*\\s+)?([A-Z0-9_-]+(?:/[A-Za-z0-9_-]+)?)\\s*$"
)'

# --- catppuccin theme ---
set -g @catppuccin_flavor 'mocha'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# window format (single definition used for both active/inactive;
# add @catppuccin_window_status_style / a distinct current-format
# if you want the active window to stand out more)
set -g window-status-format '#I:#(pwd="#{pane_current_path}"; echo ${pwd####*/})#F'
set -g window-status-current-format '#I:#(pwd="#{pane_current_path}"; echo ${pwd####*/})#F'

set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

